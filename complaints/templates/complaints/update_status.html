{% extends "base.html" %}
{% block content %}
<style>
:root {
    --police-blue: #0b1f3a;
    --police-gold: #c9a227;
    --border: #d1d5db;
    --bg-light: #f4f6f9;
    --text-dark: #111827;
    --text-muted: #6b7280;
    --danger: #b91c1c;
}

body {
    background: var(--bg-light);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ===== MAIN CARD ===== */
.update-card {
    max-width: 700px;
    margin: 3rem auto;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 2rem;
}

/* ===== HEADER ===== */
.update-card h2 {
    font-size: 1.1rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--police-blue);
    border-bottom: 3px solid var(--police-gold);
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
}

/* ===== CASE INFO ===== */
.case-info {
    background: #f9fafb;
    border-left: 4px solid var(--police-blue);
    padding: 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
}

.case-info p {
    margin: 0.3rem 0;
}

.case-info strong {
    color: var(--police-blue);
}

/* ===== FORM ===== */
.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-dark);
    margin-bottom: 0.4rem;
}

.form-group textarea {
    width: 100%;
    min-height: 120px;
    padding: 0.6rem;
    border: 1px solid var(--border);
    font-size: 0.85rem;
    resize: vertical;
}

.form-group textarea:focus {
    outline: none;
    border-color: var(--police-blue);
}

/* ===== WARNING NOTE ===== */
.warning-note {
    font-size: 0.75rem;
    color: var(--danger);
    margin-bottom: 1rem;
}

/* ===== BUTTON ===== */
.submit-btn {
    background: var(--police-blue);
    color: #ffffff;
    border: none;
    padding: 0.7rem 1.5rem;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
}

.submit-btn:hover {
    background: #08162a;
}
</style>
<div class="update-card">

    <h2>Update Complaint Status</h2>

    <div class="case-info">
        <p><strong>Complaint Subject:</strong> {{ complaint.subject }}</p>
        <p><strong>Current Status:</strong> {{ complaint.status }}</p>
        <p><strong>New Status:</strong> {{ new_status }}</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Police Remark</label>
            <textarea name="police_remark" required
                placeholder="Enter official police remarks for audit and legal records..."></textarea>
        </div>

        <div class="warning-note">
            ⚠ Police remarks are mandatory and permanently recorded in the audit log.
        </div>

        <button type="submit" class="submit-btn">
            Confirm Status Change
        </button>
    </form>

</div>


{% endblock %}
