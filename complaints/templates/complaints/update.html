{% extends "base.html" %}
{% block content %}
<style>
:root {
    --police-blue: #0b1f3a;
    --police-gold: #c9a227;
    --border: #d1d5db;
    --bg-light: #f4f6f9;
    --text-dark: #111827;
    --text-muted: #6b7280;
    --danger: #b91c1c;
}

body {
    background: var(--bg-light);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ===== CARD ===== */
.update-complaint-card {
    max-width: 650px;
    margin: 3rem auto;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 2rem;
}

/* ===== HEADER ===== */
.update-complaint-card h2 {
    font-size: 1.1rem;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--police-blue);
    border-bottom: 3px solid var(--police-gold);
    padding-bottom: 0.5rem;
    margin-bottom: 1.8rem;
}

/* ===== FORM ===== */
.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-dark);
    margin-bottom: 0.4rem;
}

.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid var(--border);
    font-size: 0.85rem;
}

.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--police-blue);
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

/* ===== NOTE ===== */
.form-note {
    font-size: 0.75rem;
    color: var(--danger);
    margin-bottom: 1.5rem;
}

/* ===== BUTTON ===== */
.submit-btn {
    background: var(--police-blue);
    color: #ffffff;
    border: none;
    padding: 0.7rem 1.6rem;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
}

.submit-btn:hover {
    background: #08162a;
}
</style>
<div class="update-complaint-card">

    <h2>Update Complaint</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Complaint Status</label>
            <select name="status" required>
                <option value="ACCEPTED">Accepted</option>
                <option value="REJECTED">Rejected</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="CLOSED">Closed</option>
            </select>
        </div>

        <div class="form-group">
            <label>Police Remark</label>
            <textarea name="police_remark" required
                placeholder="Enter official police remarks for legal and audit purposes..."></textarea>
        </div>

        <div class="form-note">
            ⚠ Police remarks are mandatory and permanently recorded.  
            Rejection decisions must include clear justification.
        </div>

        <button type="submit" class="submit-btn">
            Confirm Update
        </button>
    </form>

</div>

{% endblock %}
