{% extends "base.html" %}
{% block content %}
<style>
:root {
    --police-blue: #0b1f3a;
    --police-gold: #c9a227;
    --border: #d1d5db;
    --bg-light: #f4f6f9;
    --text-dark: #111827;
    --text-muted: #6b7280;
    --success-bg: #ecfdf5;
    --success-border: #047857;
}

body {
    background: var(--bg-light);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
}

/* ===== CARD ===== */
.appeal-card {
    max-width: 620px;
    margin: 4rem auto;
    background: white;
    border: 1px solid var(--border);
    padding: 2rem;
}

/* ===== TITLE ===== */
.appeal-card h2 {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--police-blue);
    text-transform: uppercase;
    border-bottom: 3px solid var(--police-gold);
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
}

/* ===== MESSAGE ===== */
.appeal-message {
    background: var(--success-bg);
    border-left: 5px solid var(--success-border);
    padding: 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.6;
}

/* ===== FOOTNOTE ===== */
.appeal-note {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* ===== LOGOUT BUTTON ===== */
.logout-btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.6rem 1.75rem;
    background: var(--police-blue);
    color: white;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 4px;
}

.logout-btn:hover {
    background: #06142b;
}
</style>
<div class="appeal-card">
    <h2>Appeal Submitted</h2>

    <div class="appeal-message">
        Your appeal has been successfully submitted and forwarded to the appropriate authority
        for review.
    </div>

    <div class="appeal-note">
        You will be notified once a decision has been made. Do not submit duplicate appeals.
    </div>

    <a href="{% url 'logout' %}" class="logout-btn">
        Logout
    </a>
</div>

{% endblock %}
